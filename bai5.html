<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Thông tin thành viên</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
    }
    h1 {
        text-align: center;
        font-size: 22px;
    }
    form {
        width: 420px;
        margin: auto;
    }
    .row {
        display: flex;
        align-items: center;
        margin-bottom: 8px;
    }
    .row label {
        width: 90px;
        text-align: right;
        margin-right: 8px;
        font-size: 14px;
    }
    .row input[type="text"],
    .row input[type="email"],
    .row input[type="number"],
    .row select,
    .row input[type="file"] {
        flex: 1;
        padding: 3px;
    }
    .required {
        color: red;
        margin-left: 4px;
    }
    .checks label, .radios label {
        font-weight: normal;
        margin-right: 10px;
    }
    textarea {
        flex: 1;
        height: 60px;
    }
    .buttons {
        text-align: center;
        margin-top: 15px;
    }
    .buttons button {
        padding: 5px 16px;
        margin: 0 5px;
    }
</style>
</head>
<body>

<h1>PHIẾU ĐĂNG KÝ</h1>

<form>
    <div class="row">
        <label for="hoten">Họ và tên:</label>
        <input type="text" id="hoten" name="hoten" required>
        <span class="required">(*)</span>
    </div>

    <div class="row">
        <label for="diachi">Địa chỉ:</label>
        <input type="text" id="diachi" name="diachi">
    </div>

    <div class="row">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <span class="required">(*)</span>
    </div>

    <div class="row radios">
        <label>Giới tính:</label>
        <input type="radio" id="nam" name="gioitinh" value="Nam">
        <label for="nam">Nam</label>
        <input type="radio" id="nu" name="gioitinh" value="Nữ">
        <label for="nu">Nữ</label>
    </div>

    <div class="row">
        <label for="tuoi">Tuổi:</label>
        <input type="number" id="tuoi" name="tuoi" required>
        <span class="required">(*)</span>
    </div>

    <div class="row" style="align-items:flex-start;">
        <label style="margin-top:2px;">Sở thích:</label>
        <div class="checks">
            <div><input type="checkbox" id="thethao" name="sothich" value="The thao"><label for="thethao">Thể thao</label></div>
            <div><input type="checkbox" id="vanhoc" name="sothich" value="Van hoc"><label for="vanhoc">Văn học</label></div>
            <div><input type="checkbox" id="cntt" name="sothich" value="CNTT"><label for="cntt">Công nghệ thông tin</label></div>
            <div><input type="checkbox" id="lichsu" name="sothich" value="Lich su"><label for="lichsu">Lịch sử</label></div>
            <div><input type="checkbox" id="game" name="sothich" value="Game"><label for="game">Game</label></div>
        </div>
    </div>

    <div class="row">
        <label for="chuyennganh">Chuyên ngành:</label>
        <select id="chuyennganh" name="chuyennganh">
            <option>Công nghệ Web</option>
            <option>Mạng máy tính</option>
            <option>Kỹ thuật phần mềm</option>
            <option>Hệ thống thông tin</option>
        </select>
    </div>

    <div class="row">
        <label for="gopfile">Gửi hình:</label>
        <input type="file" id="gopfile" name="gopfile">
    </div>

    <div class="row" style="align-items:flex-start;">
        <label style="margin-top:2px;">Yêu cầu:</label>
        <textarea name="yeucau"></textarea>
    </div>

    <div class="buttons">
        <button type="submit">Gửi thông tin</button>
        <button type="reset">Nhập lại</button>
    </div>
</form>

</body>
</html>
